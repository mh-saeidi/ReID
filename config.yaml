application:
  name: YOLO26 Person ReID
  version: 1.0.0
  log_level: INFO
models:
  detector: models/yolo26n.pt
  reid: models/yolo26n-reid.onnx
device:
  device: auto
  fp16: true
detector:
  imgsz: 640
  confidence: 0.35
  iou: 0.5
  person_class_id: 0
recognition:
  mode: face
face:
  backend: auto
  detector_model: models/face_detection_yunet_2023mar.onnx
  recognition_model: models/w600k_r50.onnx
  detection_confidence: 0.6
  align: true
  require_landmarks: true
  min_face_size: 36
  min_eye_distance: 12.0
  search_region: upper_body
  identity_hold_frames: 45
reid:
  input_size:
  - 256
  - 128
  similarity_metric: cosine
matching:
  recognition_threshold: 0.45
  high_confidence_threshold: 0.6
  unknown_label: Unknown
  no_face_label: No face
tracking:
  enabled: true
  tracker: botsort.yaml
  track_buffer: 30
  with_reid: true
  identity_stability:
    enabled: true
    history_size: 10
    minimum_recognized_frames: 3
    switch_margin: 0.08
enrollment:
  require_single_person: true
  selection_strategy: largest_person
  regenerate_missing_embeddings: true
output:
  directory: data/output
  save_snapshots: true
  snapshot_mode: recognized
  save_crops: false
  save_metadata: true
  save_video: true
recording:
  mode: disabled
  pre_event_seconds: 3.0
  post_event_seconds: 5.0
performance:
  reid_interval: 3
  force_reid_on_new_track: true
  force_reid_when_unknown: true
  batch_size: 16
  max_detections: 50
# One passport-style photograph per person. `identity build` enrols from the
# face directly -- no person detection -- so a head-and-shoulders portrait is
# exactly the right input.
#
# To enrol the evaluation identities instead of these demo subjects:
#   python main.py identity build --from-dir data/evaluation/enrollment
people:
- id: person_a
  name: Person A
  title: Demo Subject
  image_path: data/demo/persons/person_a.jpg
  enabled: true
- id: person_b
  name: Person B
  title: Demo Subject
  image_path: data/demo/persons/person_b.jpg
  enabled: true
face_identity:
  gallery_dir: data/people
